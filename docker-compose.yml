services:
  churn-prediction-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: customer-churn-prediction-api:latest
    container_name: customer_churn_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_LOG_LEVEL=${API_LOG_LEVEL:-info}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - MODEL_PATH=${MODEL_PATH:-models/final_model.joblib}
      - PREPROCESSOR_PATH=${PREPROCESSOR_PATH:-models/preprocessor.joblib}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
